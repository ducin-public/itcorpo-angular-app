<div class="max-w-4xl mx-auto" *ngIf="!isLoading && project">
  <a [routerLink]="['/projects']" class="inline-flex items-center text-indigo-600 hover:text-indigo-800 mb-4 group">
    <svg class="w-5 h-5 mr-2 transition-transform duration-200 group-hover:-translate-x-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path></svg>
    Back to all projects
  </a>
  <div class="bg-white rounded-lg shadow-sm overflow-hidden">
    <img
      [src]="url()"
      [alt]="project.name"
      class="w-full h-64 object-cover"
    />

    <div class="p-6">
      <div class="flex justify-between items-start mb-6">
        <h1 class="text-2xl font-bold text-gray-900">{{project.name}}</h1>
        <span class="px-3 py-1 rounded-full text-sm" [class]="getStatusColor(project.status)">
          {{project.name | titlecase}}
        </span>
      </div>

      <p class="text-gray-600 mb-6">{{project.description}}</p>

      <div class="grid grid-cols-2 gap-6 mb-8">
        <div>
          <h2 class="text-lg font-semibold text-gray-900 mb-4">Project Details</h2>
          <div class="space-y-2">
            <p class="text-sm">
              <span class="text-gray-500">Budget:</span>
              <span class="text-gray-900">{{formatCurrency(project.budget)}}</span>
            </p>
            <p class="text-sm">
              <span class="text-gray-500">Start Date:</span>
              <span class="text-gray-900">{{formatDate(project.startDate)}}</span>
            </p>
            <p class="text-sm">
              <span class="text-gray-500">End Date:</span>
              <span *ngIf="project.endDate" class="text-gray-900">{{formatDate(project.endDate)}}</span>
            </p>
          </div>
        </div>
      </div>

      <h2 class="text-lg font-semibold text-gray-900 mb-4">Project Team</h2>
      <ul>
        <li *ngFor="let teamMember of project.team">
          TODO
        </li>
      </ul>
    </div>
  </div>
</div>

<div *ngIf="isLoading" class="flex justify-center items-center h-64">
  <div class="animate-spin rounded-full h-12 w-12 border-b-2 border-gray-900"></div>
</div>
