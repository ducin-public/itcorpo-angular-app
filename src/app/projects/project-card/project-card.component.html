<div class="bg-white rounded-lg shadow-sm overflow-hidden">
  <div class="flex">
    <div class="w-48 h-full flex-shrink-0 bg-gray-100">
      <img
        [src]="url()"
        [alt]="project.name"
        class="w-full h-full object-cover"
        style="min-height: 160px"
        onerror="this.src='assets/project-placeholder.png'"
      >
    </div>

    <div class="flex-grow p-6">
      <div class="flex items-start justify-between">
        <div>
          <h3 class="text-lg font-semibold text-gray-900 mb-1">
            {{ project.name }}
          </h3>
          <p class="text-sm text-gray-600 mb-2">{{ project.description }}</p>
          <div class="flex items-center space-x-4">
            <span [class]="'px-2 py-1 rounded-full text-xs font-medium ' + getStatusColor(project.status)">
              {{ project.status | titlecase }}
            </span>
            <span class="text-sm text-gray-600">
              Budget: {{ project.budget | currency }}
            </span>
            <span class="text-sm text-gray-600 flex items-center">
              <span class="mr-1">👥</span>
              {{ project.team.length || 0 }} members
            </span>
          </div>
        </div>
        <div class="flex space-x-2">
          <button class="text-blue-600 hover:text-blue-800" (click)="onView()">
            <i class="fas fa-eye"></i>
          </button>
          <button (click)="view.emit()" class="text-gray-400 hover:text-indigo-600">
            👁️
          </button>
          <button (click)="edit.emit()" class="text-gray-400 hover:text-indigo-600">
            ✏️
          </button>
          <button (click)="delete.emit()" class="text-gray-400 hover:text-red-600">
            🗑️
          </button>
        </div>
      </div>
    </div>
  </div>
</div>
