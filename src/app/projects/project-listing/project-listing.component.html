<div>
  <div class="flex justify-between items-center mb-6">
    <h1 class="text-2xl font-bold text-gray-900">Projects</h1>
    <button class="bg-indigo-600 text-white px-4 py-2 rounded-lg flex items-center space-x-2 hover:bg-indigo-700">
      <span>New Project</span>
    </button>
  </div>

  @if (projects.isLoading()) {
    <itcorpo-spinner></itcorpo-spinner>
  } @else if (projects.error()) {
    <div class="text-red-600">Could not load projects.</div>
  } @else if (projects.hasValue()) {
    @let projectList = projects.value();
    <div class="space-y-6">
      <div class="text-sm text-gray-600 mb-4">Total projects: {{ projectList.length }}</div>
      @for (project of projectList; track project.id) {
        <div>
          <itcorpo-project-card
            [project]="project"
            (view)="onView(project)"
            (edit)="onEdit(project)"
            (delete)="onDelete(project)">
          </itcorpo-project-card>
        </div>
      }
    </div>
  }
</div>
