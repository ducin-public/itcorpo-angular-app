<itcorpo-sidebar [(collapsed)]="sidebarCollapsed">
  RECENTLY VIEWED EMPLOYEES DISPLAYED HERE
</itcorpo-sidebar>

<span (click)="onToggleSidebar()" class="icon">📖</span>

<h2>Our Employees</h2>

city: <itcorpo-dropdown [options]="cities"></itcorpo-dropdown>

<itcorpo-spinner *ngIf="!(employees$ | async)"></itcorpo-spinner>

<section *ngIf="employees$ | async as employees">
  count: {{ employees.length }}
  <ul>
    <li *ngFor="let e of employees">
      {{ e | nameAndTitle }} {{ e | flag }}
      (<a routerLink="/employees/{{ e.id }}" routerLinkActive="active">details</a>)
    </li>
  </ul>
</section>
