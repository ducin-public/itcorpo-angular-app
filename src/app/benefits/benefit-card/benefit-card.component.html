<div class="bg-white rounded-lg shadow-sm p-6">
  <div class="flex items-start justify-between">
    <div>
  <span [class]="'px-2 py-1 rounded-full text-xs font-medium ' + getTypeClass(benefit)">
        {{ capitalize(benefit.service.name) }}
      </span>
      <h3 class="text-lg font-semibold text-gray-900 mt-2">
        {{ benefit.service.name }}
      </h3>
    </div>
    <button
      (click)="delete.emit()"
      class="text-gray-400 hover:text-red-600"
    >
      <svg class="h-5 w-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M3 6h18M19 6v14a2 2 0 01-2 2H7a2 2 0 01-2-2V6m3 0V4a2 2 0 012-2h4a2 2 0 012 2v2M10 11v6M14 11v6"/>
      </svg>
    </button>
  </div>

  <div class="mt-4 space-y-2">
    <div class="flex items-center text-sm text-gray-600">
      <svg class="h-4 w-4 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8c-1.657 0-3 .895-3 2s1.343 2 3 2 3 .895 3 2-1.343 2-3 2m0-8c1.11 0 2.08.402 2.599 1M12 8V7m0 1v8m0 0v1m0-1c-1.11 0-2.08-.402-2.599-1M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/>
      </svg>
      Monthly Fee: {{ benefit.monthlyFee | currency:'EUR' }}
    </div>
    <div class="flex items-center text-sm text-gray-600">
      <svg class="h-4 w-4 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"/>
      </svg>
      {{ benefit.city }}
    </div>
  </div>
</div>
