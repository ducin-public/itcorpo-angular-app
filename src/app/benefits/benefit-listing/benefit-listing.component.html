  @if (!(benefits$ | async)) {
    <itcorpo-spinner class="flex justify-center mt-8"></itcorpo-spinner>
  }

  @if (benefits$ | async; as benefits) {
    <div class="mt-12">
      <!-- Page header -->
      <div class="mb-8 flex flex-col sm:flex-row sm:items-center sm:justify-between gap-4">
        <div>
          <h1 class="text-2xl font-bold text-gray-900">Employee Benefits</h1>
          <p class="text-sm text-gray-600 mt-1">Browse and manage available employee benefits.</p>
        </div>
        <!-- Toolbar: simple search + count -->
        <div class="flex items-center gap-3">
          <div class="relative">
            <input type="text" placeholder="Search benefits" class="pl-10 pr-3 py-2 rounded-lg border border-gray-200 focus:outline-none focus:ring-2 focus:ring-blue-200" />
            <svg class="w-4 h-4 absolute left-3 top-1/2 -translate-y-1/2 text-gray-400" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M21 21l-4.35-4.35" />
              <circle cx="11" cy="11" r="6" />
            </svg>
          </div>
          <div class="text-sm text-gray-600">Available: <span class="font-medium text-gray-800">{{ benefits.length }}</span></div>
        </div>
      </div>
      <!-- Grid of benefit cards with subtle hover lift -->
      <div class="grid gap-6 grid-cols-1 sm:grid-cols-2 lg:grid-cols-3">
        @for (benefit of benefits; track benefit) {
          <div class="transform transition duration-200 hover:-translate-y-1 hover:shadow-lg rounded-lg">
            <itcorpo-benefit-card [benefit]="benefit"></itcorpo-benefit-card>
          </div>
        }
      </div>
    </div>
  }
