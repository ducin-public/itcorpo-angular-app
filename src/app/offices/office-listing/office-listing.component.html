<div>
  <div class="flex justify-between items-center mb-6">
    <h1 class="text-2xl font-bold text-gray-900">Offices</h1>
    <button
      (click)="addNewOffice()"
      class="bg-indigo-600 text-white px-4 py-2 rounded-lg flex items-center space-x-2 hover:bg-indigo-700"
      >
      <svg lucidePlus class="h-5 w-5"></svg>
      <span>Add Office</span>
    </button>
  </div>

  @if (officesResource.isLoading()) {
    <itcorpo-spinner></itcorpo-spinner>
  } @else if (officesResource.error(); as err) {
    <div class="text-red-600">Could not load offices: {{ err.message }}</div>
  } @else if (officesResource.hasValue()) {
    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
      @for (office of officesResource.value(); track office) {
        <itcorpo-office-card
          [office]="office"
          (view)="onView(office)"
          (edit)="onEdit(office)"
        ></itcorpo-office-card>
      }
    </div>
  }
</div>
